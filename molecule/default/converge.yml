---

# This is a playbook to test the tasks.
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    ansible_user: root
    system_is_container: true
    setup_audit: true
    run_audit: true
    # The UBUNTU26-CIS-Audit repo is not published upstream yet, so there is no
    # benchmark_v1.0.0 tag to clone. Use the local audit content instead - this also
    # means molecule exercises the goss tests in this working tree.
    audit_content: copy
    audit_conf_source: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../UBUNTU26-CIS-Audit"
    ubtu26cis_set_boot_pass: false
    ubtu26cis_bootloader_password_hash: "grub.pbkdf2.sha512.10000.DEADBEEF.DEADBEEF"  # pragma: allowlist secret
    # Per-control container exclusions belong in vars/is_container.yml, NOT here,
    # so that the generated goss vars disable the same controls and the audit does
    # not report failures for controls the role never attempts. See
    # knowledge/conventions/cis-molecule.md.

  pre_tasks:
    - name: Set root password for GRUB user check
      ansible.builtin.shell: echo 'root:MoleculeTest123!' | chpasswd  # pragma: allowlist secret
      changed_when: false

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
