---

- name: "2.2.1 | PATCH | Ensure nis client is not installed"
  when:
    - ubtu26cis_rule_2_2_1
    - not ubtu26cis_nis_client_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.2.1
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-11
    - nis
  ansible.builtin.package:
    name: nis
    state: absent
    purge: "{{ ubtu26cis_purge_apt }}"
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "2.2.2 | PATCH | Ensure rsh client is not installed"
  when:
    - ubtu26cis_rule_2_2_2
    - not ubtu26cis_rsh_client
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.2.2
    - NIST800-53R5_CM-7
    - rsh
  ansible.builtin.package:
    name: rsh-client
    state: absent
    purge: "{{ ubtu26cis_purge_apt }}"
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "2.2.3 | PATCH | Ensure talk client is not installed"
  when:
    - ubtu26cis_rule_2_2_3
    - not ubtu26cis_talk_client
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.2.3
    - NIST800-53R5_CM-7
    - talk
  ansible.builtin.package:
    name: talk
    state: absent
    purge: "{{ ubtu26cis_purge_apt }}"
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "2.2.4 | PATCH | Ensure telnet client is not installed"
  when:
    - ubtu26cis_rule_2_2_4
    - not ubtu26cis_telnet_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.2.4
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-11
    - telnet
  ansible.builtin.package:
