    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "2.2.5 | PATCH | Ensure ldap client is not installed"
  when:
    - ubtu26cis_rule_2_2_5
    - not ubtu26cis_ldap_clients_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.2.5
    - NIST800-53R5_CM-7
