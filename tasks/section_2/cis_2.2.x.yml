  ansible.builtin.package:
    name: ldap-utils
    state: absent
    purge: "{{ ubtu26cis_purge_apt }}"
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "2.2.6 | PATCH | Ensure ftp client is not installed"
  when:
    - ubtu26cis_rule_2_2_6
    - not ubtu26cis_ftp_client
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.2.6
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-11
    - ftp
  ansible.builtin.package:
    name:
      - ftp
      - tnftp
      - atftp
      - inetutils-ftp
      - ftp-ssl
    state: absent
    purge: "{{ ubtu26cis_purge_apt }}"
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"
