---

- name: "2.3.1.1 | PATCH | Ensure a single time synchronization daemon is in use"
  when: ubtu26cis_rule_2_3_1_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.3.1.1
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
    - chrony
    - ntp
    - systemd-timesyncd
  block:
    - name: "2.3.1.1 | PATCH | Ensure a single time synchronization daemon is in use | Pkg installed"
      ansible.builtin.package:
        name: "{{ ubtu26cis_time_sync_tool }}"
        state: present
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

    - name: "2.3.1.1 | PATCH | Ensure a single time synchronization daemon is in use | other pkgs removed"
      when: item != ubtu26cis_time_sync_tool
      ansible.builtin.package:
        name: "{{ item }}"
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"
      loop:
        - chrony
        - ntp
        - systemd-timesyncd
      loop_control:
        label: "{{ item }}"
