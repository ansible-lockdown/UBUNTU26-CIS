---

- name: "2.4.2.1 | PATCH | Ensure access to at is configured"
  when:
    - ubtu26cis_rule_2_4_2_1
    - "'at' in ansible_facts['packages']"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.4.2.1
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - cron
  block:
    - name: "2.4.2.1 | PATCH | Ensure access to at is configured | Remove at.deny"
      ansible.builtin.file:
        path: /etc/at.deny
        state: absent

    - name: "2.4.2.1 | AUDIT | Ensure access to at is configured | Check for daemon group"
      ansible.builtin.shell: |
        set -o pipefail
        getent group daemon | cut -d: -f1
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_at_groups

    - name: "2.4.2.1 | PATCH | Ensure access to at is configured | Check for at.allow"
      ansible.builtin.stat:
        path: /etc/at.allow
      register: discovered_at_allow_status

    - name: "2.4.2.1 | PATCH | Ensure access to at is configured | Create at.allow if doesn't exist"
      when: not discovered_at_allow_status.stat.exists
      ansible.builtin.file:
        path: /etc/at.allow
        owner: root
        group: "{{ ('daemon' in discovered_at_groups.stdout_lines) | ternary('daemon', 'root') }}"
        mode: 'u-x,g-wx,o-rwx'
        state: touch

    - name: "2.4.2.1 | PATCH | Ensure access to at is configured | update at.allow if exists"
      when: discovered_at_allow_status.stat.exists
      ansible.builtin.file:
        path: /etc/at.allow
        owner: root
        group: "{{ ('daemon' in discovered_at_groups.stdout_lines) | ternary('daemon', 'root') }}"
        mode: 'u-x,g-wx,o-rwx'
