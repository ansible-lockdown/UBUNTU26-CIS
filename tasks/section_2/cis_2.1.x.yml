---

- name: "2.1.1 | PATCH | Ensure autofs services are not in use"
  when:
    - ubtu26cis_rule_2_1_1
    - "'autofs' in ansible_facts['packages']"
  tags:
    - level1-server
    - level2-workstation
    - patch
    - rule_2.1.1
    - NIST800-53R5_SI-3
    - NIST800-53R5_MP-7
  block:
    - name: "2.1.1 | PATCH | Ensure autofs services are not in use | Remove Package"
      when:
        - not ubtu26cis_autofs_services
        - not ubtu26cis_autofs_mask
      ansible.builtin.package:
        name: autofs
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

    - name: "2.1.1 | PATCH | Ensure autofs services are not in use | Mask service"
      when:
        - not ubtu26cis_autofs_services
        - ubtu26cis_autofs_mask
      notify: Systemd_daemon_reload
      ansible.builtin.systemd:
        name: autofs
        enabled: "{{ ('autofs' in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ ('autofs' in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true

- name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use"
  when: ubtu26cis_rule_2_1_2
  tags:
    - level1-server
    - level2-workstation
    - patch
    - avahi
    - rule_2.1.2
    - NIST800-53R5_SI-4
  block:
    - name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use | Remove package"
      when:
        - not ubtu26cis_avahi_server
        - not ubtu26cis_avahi_mask
        - "'avahi-daemon' in ansible_facts['packages'] or 'avahi-autoipd' in ansible_facts['packages']"
      ansible.builtin.package:
        name:
          - avahi-autoipd
          - avahi-daemon
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

    - name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use | Mask service"
      when:
        - not ubtu26cis_avahi_server
        - ubtu26cis_avahi_mask
      notify: Systemd_daemon_reload
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: "{{ ('avahi-daemon' in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ ('avahi-daemon' in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true
      loop:
        - avahi-daemon.socket
        - avahi-daemon.service
      loop_control:
        label: "{{ item }}"

- name: "2.1.3 | PATCH | Ensure dhcp server services are not in use"
  when: ubtu26cis_rule_2_1_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - dhcp
    - rule_2.1.3
    - NIST800-53R5_CM-7
  block:
    - name: "2.1.3 | PATCH | Ensure dhcp server services are not in use | Remove package"
      when:
        - not ubtu26cis_dhcp_server
        - not ubtu26cis_dhcp_mask
        - ansible_facts['packages'] | dict2items | selectattr('key', 'match', '^kea') | list | length > 0
      ansible.builtin.package:
        name:
          - kea
          - kea-dhcp4-server
          - kea-dhcp6-server
          - kea-dhcp-ddns-server
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

    - name: "2.1.3 | PATCH | Ensure dhcp server services are not in use | Mask service"
      when:
        - not ubtu26cis_dhcp_server
        - ubtu26cis_dhcp_mask
      notify: Systemd_daemon_reload
      ansible.builtin.systemd:
        name: "{{ item.unit }}"
        enabled: "{{ (item.pkg in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ (item.pkg in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true
      loop:
        - { unit: kea-dhcp4-server.service, pkg: kea-dhcp4-server }
        - { unit: kea-dhcp6-server.service, pkg: kea-dhcp6-server }
        - { unit: kea-dhcp-ddns-server.service, pkg: kea-dhcp-ddns-server }
      loop_control:
        label: "{{ item.unit }}"

