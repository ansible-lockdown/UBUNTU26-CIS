        - "'apache2' in ansible_facts['packages']"
      ansible.builtin.package:
        name: apache2
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

    - name: "2.1.19 | PATCH | Ensure web server services are not in use | Remove nginx server"
      when:
        - not ubtu26cis_nginx_server
        - not ubtu26cis_nginx_mask
        - "'nginx' in ansible_facts['packages']"
      ansible.builtin.package:
        name: nginx
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

    - name: "2.1.19 | PATCH | Ensure web server services are not in use | Mask httpd service"
      when:
        - not ubtu26cis_apache2_server
        - ubtu26cis_apache2_mask
        - "'apache2' in ansible_facts['packages']"
      notify: Systemd_daemon_reload
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: "{{ ('apache2' in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ ('apache2' in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true
      loop:
        - apache2.service
        - apache2.socket
      loop_control:
        label: "{{ item }}"

    - name: "2.1.19 | PATCH | Ensure web server services are not in use | Mask nginx service"
      when:
        - not ubtu26cis_nginx_server
        - ubtu26cis_nginx_mask
        - "'nginx' in ansible_facts['packages']"
      notify: Systemd_daemon_reload
      ansible.builtin.systemd:
        name: nginx.service
        enabled: "{{ ('nginx' in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ ('nginx' in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true

