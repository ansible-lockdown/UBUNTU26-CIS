---

- name: "5.2.5 | AUDIT | Ensure re-authentication for privilege escalation is not disabled globally | Find all sudoers files"
  when: ubtu26cis_rule_5_2_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sudo
    - rule_5.2.5
    - NIST800-53R5_AC-6
  ansible.builtin.shell: |
    set -o pipefail
    find /etc/sudoers /etc/sudoers.d/ -type f ! -name '*~' ! -name '*.*'
  args:
    executable: "{{ ubtu26cis_shell_executable }}"
  changed_when: false
  failed_when: discovered_sudoers_files.rc not in [0, 1]
  check_mode: false
  register: discovered_sudoers_files

- name: "5.2.1 | PATCH | Ensure sudo is installed"
  when: ubtu26cis_rule_5_2_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_5.2.1
    - NIST800-53R5_AC-6
    - sudo
  ansible.builtin.package:
    name: "{{ ubtu26cis_sudo_package }}"
    state: present
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "5.2.2 | PATCH | Ensure sudo commands use pty"
  when: ubtu26cis_rule_5_2_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_5.2.2
    - NIST800-53R5_AC-6
    - sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^Defaults\s+use_'
    line: 'Defaults        use_pty'
    insertafter: '^\s*Defaults'
    validate: '/usr/sbin/visudo -cf %s'

- name: "5.2.3 | PATCH | Ensure sudo log file exists"
  when: ubtu26cis_rule_5_2_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_5.2.3
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
    - sudo
  # Ubuntu 26.04 ships sudo-rs, which does not support the logfile= Defaults
  # setting (visudo rejects it). The benchmark allows two methods:
  #   Method A (sudo-rs): capture authpriv.* via rsyslog/journald
  #   Method B (classic sudo): Defaults logfile=
  block:
    - name: "5.2.3 | AUDIT | Ensure sudo log file exists | Detect sudo implementation"
      ansible.builtin.command: sudo --version
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_sudo_version

    - name: "5.2.3 | PATCH | Ensure sudo log file exists | Method B - classic sudo logfile"
      when: "'sudo-rs' not in (discovered_sudo_version.stdout | default(''))"
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^Defaults\s+logfile'
        line: 'Defaults        logfile="{{ ubtu26cis_sudo_logfile }}"'
        insertafter: '^\s*Defaults'
        validate: 'visudo -cf %s'

    - name: "5.2.3 | PATCH | Ensure sudo log file exists | Method A - route authpriv to sudo log via rsyslog"
      when:
        - "'sudo-rs' in (discovered_sudo_version.stdout | default(''))"
        - ubtu26cis_syslog_service == 'rsyslog'
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/30-sudo.conf
        content: |
          # CIS 5.2.3 - durable sudo event capture
          authpriv.* {{ ubtu26cis_sudo_logfile }}
        owner: root
        group: root
        mode: 'u-x,go-wx'
      notify: Restart syslog service

    - name: "5.2.3 | PATCH | Ensure sudo log file exists | Method A - sudo log file permissions"
      when: "'sudo-rs' in (discovered_sudo_version.stdout | default(''))"
      ansible.builtin.file:
        path: "{{ ubtu26cis_sudo_logfile }}"
        state: touch
        owner: root
        group: adm
        mode: 'u-x,g-wx,o-rwx'
      changed_when: false

    - name: "5.2.3 | AUDIT | Ensure sudo log file exists | Warn when journald is the syslog service"
      when:
        - "'sudo-rs' in (discovered_sudo_version.stdout | default(''))"
        - ubtu26cis_syslog_service != 'rsyslog'
      ansible.builtin.debug:
        msg:
          - "Warning!! sudo-rs is in use and the syslog service is not rsyslog."
          - "journald captures authpriv events, satisfying the benchmark, but no"
          - "dedicated {{ ubtu26cis_sudo_logfile }} is populated. Set"
          - "ubtu26cis_syslog_service to rsyslog if a dedicated sudo log is required."

- name: "5.2.4 | PATCH | Ensure users must provide password for escalation"
  when: ubtu26cis_rule_5_2_4
  tags:
    - level2-server
    - level2-workstation
    - patch
    - sudo
    - rule_5.2.4
    - NIST800-53R5_AC-6
  block:
    - name: "5.2.4 | AUDIT | Ensure users must provide password for escalation | discover accts with NOPASSWD"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Ei '(nopasswd)' /etc/sudoers /etc/sudoers.d/* | cut -d':' -f1
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      become: true
      changed_when: false
      failed_when: discovered_sudoers_nopasswd.rc not in [0, 1]
      check_mode: false
      register: discovered_sudoers_nopasswd

    - name: "5.2.4 | PATCH | Ensure users must provide password for escalation"
      when: discovered_sudoers_nopasswd.stdout | length > 0
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^((?!#|{% for name in ubtu26cis_sudoers_exclude_nopasswd_list %}{{ name }}{% if not loop.last -%}|{%- endif -%}{% endfor %}).*)NOPASSWD(.*)'
        replace: '\1PASSWD\2'
        validate: '/usr/sbin/visudo -cf %s'
      loop: "{{ discovered_sudoers_nopasswd.stdout_lines }}"
      loop_control:
        label: "{{ item }}"

- name: "5.2.5 | PATCH | Ensure re-authentication for privilege escalation is not disabled globally"
  when: ubtu26cis_rule_5_2_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sudo
    - rule_5.2.5
    - NIST800-53R5_AC-6
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^([^#].*)!authenticate(.*)'
    replace: '\1authenticate\2'
    validate: '/usr/sbin/visudo -cf %s'
  loop: "{{ discovered_sudoers_files.stdout_lines }}"
  loop_control:
    label: "{{ item }}"

- name: "5.2.6 | PATCH | Ensure sudo timestamp_timeout is configured"
  when: ubtu26cis_rule_5_2_6
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sudo
    - rule_5.2.6
    - NIST800-53R5_AC-6
  block:
    - name: "5.2.6 | AUDIT | Ensure sudo timestamp_timeout is configured | Get files with timeout set"
      ansible.builtin.shell: |
        set -o pipefail
        grep -is 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/* | cut -d":" -f1 | uniq | sort
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_ubtu26cis_ssh_timeout_files.rc not in [0, 1]
      check_mode: false
      register: discovered_ubtu26cis_ssh_timeout_files

    - name: "5.2.6 | PATCH | Ensure sudo timestamp_timeout is configured | Set value if no results"
      when: discovered_ubtu26cis_ssh_timeout_files.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^\s*Defaults\s+timestamp_timeout='
        line: "Defaults        timestamp_timeout={{ ubtu26cis_sudo_timestamp_timeout }}"
        insertafter: '^\s*Defaults'
        validate: '/usr/sbin/visudo -cf %s'

    - name: "5.2.6 | PATCH | Ensure sudo timestamp_timeout is configured | Set value if has results"
      when: discovered_ubtu26cis_ssh_timeout_files.stdout | length > 0
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'timestamp_timeout=(\d+)'
        replace: "timestamp_timeout={{ ubtu26cis_sudo_timestamp_timeout }}"
        validate: '/usr/sbin/visudo -cf %s'
      loop: "{{ discovered_ubtu26cis_ssh_timeout_files.stdout_lines }}"
      loop_control:
        label: "{{ item }}"

- name: "5.2.7 | PATCH | Ensure access to the su command is restricted"
  when: ubtu26cis_rule_5_2_7
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sudo
    - rule_5.2.7
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.2.7 | PATCH | Ensure access to the su command is restricted | Ensure sugroup exists"
      ansible.builtin.group:
        name: "{{ ubtu26cis_sugroup }}"
        state: present

    - name: "5.2.7 | PATCH | Ensure access to the su command is restricted | remove users from group"
      ansible.builtin.lineinfile:
        path: /etc/group
        regexp: '^{{ ubtu26cis_sugroup }}(:.:.*:).*$'
        line: '{{ ubtu26cis_sugroup }}\g<1>'
        backrefs: true

    - name: "5.2.7 | PATCH | Ensure access to the su command is restricted | Setting pam_wheel to use_uid"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^(#)?auth\s+required\s+pam_wheel\.so'
        line: 'auth           required        pam_wheel.so use_uid group={{ ubtu26cis_sugroup }}'
