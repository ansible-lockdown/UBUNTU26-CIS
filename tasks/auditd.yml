---

# Since auditd rules are dependent on syscalls and syscall tables are architecture specific,
# we need to update the auditd rules depending on the architecture of the system.
# This task passed the syscalls table to the auditd template and updates the auditd rules
- name: "POST | AUDITD | Set supported_syscalls variable"
  ansible.builtin.shell: |
    set -o pipefail
    ausyscall --dump |  awk  '{print $2}'
  args:
    executable: "{{ ubtu26cis_shell_executable }}"
  changed_when: false
  failed_when: discovered_auditd_syscalls.rc not in [ 0, 1 ]
  check_mode: false
  register: discovered_auditd_syscalls

- name: "POST | AUDITD | Ensure use of privileged commands is collected"
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(df | grep '^/dev' | grep -Ev '(asdfmnop{% if ubtu26cis_priv_command_excluded_mounts | length > 0 %}|{{ exclude_options }}{% endif %})' | awk '{ print $NF }');
    do find $i -xdev -type f -perm /6000 2>/dev/null;
    done
  args:
    executable: "{{ ubtu26cis_shell_executable }}"
  changed_when: false
  failed_when: discovered_privilege_processes.rc not in [0, 1]
  check_mode: false
  register: discovered_privilege_processes
  vars:
    exclude_options: "{{ ubtu26cis_priv_command_excluded_mounts | join('|') }}"

- name: "POST | AUDIT | Check if auditd is immutable before changes"
  when: "'auditd' in ansible_facts['packages']"
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    auditctl -s | grep "enabled 2"
  args:
    executable: "{{ ubtu26cis_shell_executable }}"
  changed_when: false
  failed_when: discovered_auditd_immutable_check.rc not in [ 0, 1 ]
  check_mode: false
  register: discovered_auditd_immutable_check

- name: "POST | AUDITD | Discover optional directories watched by 6.2.3.8 and 6.2.3.9"
  when: update_audit_template
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/network/interfaces.d
    - /etc/NetworkManager
  register: discovered_audit_optional_dirs

- name: "POST | AUDITD | Apply auditd template for section 6.2.4.x"
  when: update_audit_template
  vars:
    supported_syscalls: "{{ discovered_auditd_syscalls.stdout_lines }}"
  ansible.builtin.template:
    src: audit/99_auditd.rules.j2
    dest: /etc/audit/rules.d/99_auditd.rules
    owner: root
    group: root
    mode: 'u-x,go-wx'
  register: discovered_audit_rules_updated
  notify: Update auditd

- name: "POST | AUDITD | Load rules regardless of errors for 6.2.3.34"
  when:
    - update_audit_template
    - ubtu26cis_rule_6_2_3_34
  ansible.builtin.lineinfile:
    path: /etc/audit/rules.d/01-initialize.rules
    line: '-c'
    create: true
    owner: root
    group: root
    mode: 'u-x,go-wx'
  notify: Update auditd

- name: POST | AUDITD | Set up auditd user logging exceptions
  when: ubtu26cis_allow_auditd_uid_user_exclusions
  ansible.builtin.template:
    src: audit/98_auditd_exception.rules.j2
    dest: /etc/audit/rules.d/98_auditd_exceptions.rules
    owner: root
    group: root
    mode: 'u-x,go-rwx'
  notify: Update auditd

- name: POST | AUDITD | Flush handlers
  ansible.builtin.meta: flush_handlers
