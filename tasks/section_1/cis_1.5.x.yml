---

- name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured"
  when: ubtu26cis_rule_1_5_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.1
    - NIST800-53R5_CM-6
    - sysctl
  ansible.posix.sysctl:
    name: fs.protected_hardlinks
    value: '1'
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.2 | PATCH | Ensure fs.protected_symlinks is configured"
  when: ubtu26cis_rule_1_5_2
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.5.2
    - NIST800-53R5_CM-6
    - sysctl
  ansible.posix.sysctl:
    name: fs.protected_symlinks
    value: '1'
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.3 | PATCH | Ensure kernel.yama.ptrace_scope is configured"
  when: ubtu26cis_rule_1_5_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.3
    - NIST800-53R5_CM-6
    - ptrace
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "{{ ubtu26_ptrace_value }}"
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.4 | PATCH | Ensure fs.suid_dumpable is configured"
  when: ubtu26cis_rule_1_5_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.4
    - NIST800-53R5_CM-6
    - coredump
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.5 | PATCH | Ensure kernel.dmesg_restrict is configured"
  when: ubtu26cis_rule_1_5_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.5
    - NIST800-53R5_CM-6
    - sysctl
  ansible.posix.sysctl:
    name: kernel.dmesg_restrict
    value: '1'
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.6 | PATCH | Ensure prelink is not installed"
  when:
    - ubtu26cis_rule_1_5_6
    - "'prelink' in ansible_facts['packages']"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.6
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
    - prelink
  block:
    - name: "1.5.6 | PATCH | Ensure prelink is not installed | Restore binaries to normal"
      ansible.builtin.command: prelink -ua
      changed_when: false
      failed_when: false

    - name: "1.5.6 | PATCH | Ensure prelink is not installed | Remove prelink package"
      ansible.builtin.package:
        name: prelink
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "1.5.7 | PATCH | Ensure Automatic Error Reporting is configured"
  when: ubtu26cis_rule_1_5_7
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.7
    - NIST800-53R5_NA
    - apport
  block:
    - name: "1.5.7 | PATCH | Ensure Automatic Error Reporting is configured | disable"
      ansible.builtin.lineinfile:
        path: /etc/default/apport
        regexp: ^enabled
        line: enabled=0
        create: true
        owner: root
        group: root
        mode: 'go-r'

    - name: "1.5.7 | PATCH | Ensure Automatic Error Reporting is configured | remove package"
      when: "'apport' in ansible_facts['packages']"
      ansible.builtin.package:
        name: apport
        state: absent
        purge: "{{ ubtu26cis_purge_apt }}"
        lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "1.5.8 | PATCH | Ensure kernel.kptr_restrict is configured"
  when: ubtu26cis_rule_1_5_8
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.8
    - NIST800-53R5_CM-6
    - sysctl
  ansible.posix.sysctl:
    name: kernel.kptr_restrict
    value: '1'
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.9 | PATCH | Ensure kernel.randomize_va_space is configured"
  when: ubtu26cis_rule_1_5_9
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.9
    - NIST800-53R5_CM-6
    - aslr
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: '2'
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.10 | PATCH | Ensure core file size is configured"
  when: ubtu26cis_rule_1_5_10
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.10
    - NIST800-53R5_CM-6
    - coredump
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/99_zero_core.conf
    regexp: '^\* hard core'
    line: '* hard core 0'
    create: true
    owner: root
    group: root
    mode: 'go-r'

- name: "1.5.11 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured"
  when: ubtu26cis_rule_1_5_11
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.11
    - NIST800-53R5_CM-6
    - coredump
  ansible.builtin.lineinfile:
    path: /etc/systemd/coredump.conf
    regexp: '^ProcessSizeMax'
    line: 'ProcessSizeMax=0'
    create: true
    owner: root
    group: root
    mode: 'go-r'
  notify: Systemd_daemon_reload

- name: "1.5.12 | PATCH | Ensure systemd-coredump Storage is configured"
  when: ubtu26cis_rule_1_5_12
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.12
    - NIST800-53R5_CM-6
    - coredump
  ansible.builtin.lineinfile:
    path: /etc/systemd/coredump.conf
    regexp: '^Storage'
    line: 'Storage=none'
    create: true
    owner: root
    group: root
    mode: 'go-r'
  notify: Systemd_daemon_reload
