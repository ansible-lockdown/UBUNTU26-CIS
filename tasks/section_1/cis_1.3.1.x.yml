---

- name: "1.3.1.1 | PATCH | Ensure apparmor packages are installed"
  when:
    - ubtu26cis_rule_1_3_1_1
    - "'apparmor' not in ansible_facts['packages'] or 'apparmor-utils' not in ansible_facts['packages']"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.1
    - NIST800-53R5_AC-3
    - apparmor
  ansible.builtin.package:
    name: ['apparmor', 'apparmor-utils']
    state: present
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled"
  when: ubtu26cis_rule_1_3_1_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.2
    - NIST800-53R5_AC-3
    - apparmor
  block:
    - name: "1.3.1.2 | AUDIT | Ensure AppArmor is enabled | Get current settings"
      ansible.builtin.shell: |
        set -o pipefail
        grep "GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"'
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_grub_cmdline_settings.rc not in [0, 1]
      check_mode: false
      register: discovered_grub_cmdline_settings

    - name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled | Set apparmor settings if none exist"
      when: discovered_grub_cmdline_settings.stdout is not search('apparmor=')
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX=")(|apparmor=\d\s)(.*\w+")
        line: \1apparmor=1 \3
        backrefs: true
      notify: Grub update

    - name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled | Set security settings if none exist"
      when: discovered_grub_cmdline_settings.stdout is not search('security=')
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX=")(|security=\w+\s)(.*\w+")
        line: \1security=apparmor \3
        backrefs: true
      notify: Grub update

    - name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled | Set apparmor settings if none exist"
      when:
        - "'apparmor' not in discovered_grub_cmdline_settings.stdout"
        - "'security' not in discovered_grub_cmdline_settings.stdout"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="apparmor=1 security=apparmor {{ discovered_grub_cmdline_settings.stdout }}"'
        insertafter: '^GRUB_'
      notify: Grub update

    - name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled | Replace apparmor settings when exists"
      when:
        - "'apparmor' in discovered_grub_cmdline_settings.stdout or
          'security' in discovered_grub_cmdline_settings.stdout"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      with_items:
        - { regexp: 'apparmor=\w+', replace: 'apparmor=1' }
        - { regexp: 'security=\w+', replace: 'security=apparmor' }
      loop_control:
        label: "{{ item }}"
      notify: Grub update

- name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing"
  when:
    - ubtu26cis_rule_1_3_1_3
    - not ubtu26cis_apparmor_disable
    - ubtu26cis_apparmor_mode == "enforce"
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.3.1.3
    - NIST800-53R5_AC-3
    - apparmor
  block:
    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Set enforce only for GOSS"
      ansible.builtin.set_fact:
        ubtu26cis_apparmor_enforce_only: true
      changed_when: false

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Get pre apply enforce count"
      ansible.builtin.shell: |
        set -o pipefail
        apparmor_status | grep "profiles are in enforce mode" | tr -d -c 0-9
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_apparmor_profilepre_count.rc not in [0, 1]
      check_mode: false
      register: discovered_apparmor_profilepre_count

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Apply enforcing to /etc/apparmor.d profiles"
      ansible.builtin.command: aa-enforce /etc/apparmor.d/*
      changed_when: false
      failed_when: discovered_apparmor_profilepre_count.rc not in [0, 1]

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Get post apply enforce count"
      ansible.builtin.shell: |
        set -o pipefail
        apparmor_status | grep "profiles are in enforce mode" | tr -d -c 0-9
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_apparmor_profilepost_count.rc not in [0, 1]
      check_mode: false
      register: discovered_apparmor_profilepost_count

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | This flags for idempotency"
      when: discovered_apparmor_profilepre_count.stdout != discovered_apparmor_profilepost_count.stdout
      ansible.builtin.debug:
        msg: Changed! The profiles in /etc/apparmor.d were set to enforcing
      changed_when: true

- name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | complain mode variant"
  when:
    - ubtu26cis_rule_1_3_1_3
    - not ubtu26cis_apparmor_disable
    - ubtu26cis_apparmor_mode == "complain"
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.3.1.3
    - NIST800-53R5_AC-3
    - apparmor
  block:
    - name: "1.3.1.3 | AUDIT | Ensure all AppArmor Profiles are enforcing | Set enforce only false for GOSS"
      ansible.builtin.set_fact:
        ubtu26cis_apparmor_enforce_only: false
      changed_when: false

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Get pre apply enforce count"
      ansible.builtin.shell: |
        set -o pipefail
        apparmor_status | grep "profiles are in {{ ubtu26cis_apparmor_mode }} mode" | tr -d -c 0-9
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_apparmor_profile_pre_count.rc not in [0, 1]
      check_mode: false
      register: discovered_apparmor_profile_pre_count

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Apply complaining/enforcing to /etc/apparmor.d profiles"
      ansible.builtin.command: aa-{{ ubtu26cis_apparmor_mode }} /etc/apparmor.d/*
      changed_when: false
      failed_when: discovered_apparmor_profile_pre_count.rc not in [0, 1]

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Get post apply enforce count"
      ansible.builtin.shell: |
        set -o pipefail
        apparmor_status | grep "profiles are in {{ ubtu26cis_apparmor_mode }} mode" | tr -d -c 0-9
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_apparmor_profile_post_count.rc not in [0, 1]
      check_mode: false
      register: discovered_apparmor_profile_post_count

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | This flags for idempotency"
      when: discovered_apparmor_profile_pre_count.stdout != discovered_apparmor_profile_post_count.stdout
      ansible.builtin.debug:
        msg: Changed! The profiles in /etc/apparmor.d were set to {{ ubtu26cis_apparmor_mode }} mode
      changed_when: true

- name: "1.3.1.4 | PATCH | Ensure kernel.apparmor_restrict_unprivileged_unconfined is enabled"
  when: ubtu26cis_rule_1_3_1_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.4
    - NIST800-53R5_AC-3
    - apparmor
    - sysctl
  ansible.posix.sysctl:
    name: kernel.apparmor_restrict_unprivileged_unconfined
    value: '1'
    state: present
    sysctl_file: "{{ ubtu26cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true
