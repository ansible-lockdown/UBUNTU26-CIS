---

- name: "1.7.1 | PATCH | Ensure GDM login banner is configured"
  when:
    - ubtu26cis_rule_1_7_1
    - ubtu26cis_desktop_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.7.1
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - gnome
  notify: Update dconf
  block:
    - name: "1.7.1 | PATCH | Ensure GDM login banner is configured | make directory"
      ansible.builtin.file:
        path: "/etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d"
        owner: root
        group: root
        mode: 'u+x,go-w'
        state: directory

    - name: "1.7.1 | PATCH | Ensure GDM login banner is configured | banner settings"
      ansible.builtin.lineinfile:
        path: "/etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d/00-login-screen"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.insertafter }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop:
        - { regexp: '\[org\/gnome\/login-screen\]', line: '[org/gnome/login-screen]', insertafter: EOF }
        - { regexp: 'banner-message-enable', line: 'banner-message-enable=true', insertafter: '\[org\/gnome\/login-screen\]'}
        - { regexp: 'banner-message-text', line: "banner-message-text='{{ ubtu26cis_warning_banner | regex_replace('\n', ' ') | trim }}'", insertafter: 'banner-message-enable' }
      loop_control:
        label: "{{ item }}"

- name: "1.7.2 | PATCH | Ensure GDM disable-user-list is configured"
  when:
    - ubtu26cis_rule_1_7_2
    - ubtu26cis_desktop_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.7.2
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - gnome
  notify: Update dconf
  block:
    - name: "1.7.2 | PATCH | Ensure GDM disable-user-list is configured | make directories"
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: 'u+x,go-w'
        state: directory
      loop:
        - /etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d
        - /etc/dconf/profile

    - name: "1.7.2 | PATCH | Ensure GDM disable-user-list is configured | disable-user-list setting login-screen"
      ansible.builtin.lineinfile:
        path: "/etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d/00-login-screen"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.insertafter }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop:
        - { regexp: '\[org\/gnome\/login-screen\]', line: '[org/gnome/login-screen]', insertafter: EOF }
        - { regexp: 'disable-user-list', line: 'disable-user-list=true', insertafter: '\[org\/gnome\/login-screen\]'}

    - name: "1.7.2 | PATCH | Ensure GDM disable-user-list is configured | disable-user-list setting profile"
      ansible.builtin.lineinfile:
        path: "/etc/dconf/profile/{{ ubtu26cis_dconf_db_name }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.insertafter }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop:
        - { regexp: '^user-db:user', line: 'user-db:user', insertafter: EOF }
        - { regexp: '^system-db:{{ ubtu26cis_dconf_db_name }}', line: 'system-db:{{ ubtu26cis_dconf_db_name }}', insertafter: 'user-db:user'}
        - { regexp: '^file-db:/usr/share/gdm/greeter-dconf-defaults', line: 'file-db:/usr/share/gdm/greeter-dconf-defaults', insertafter: 'system-db:{{ ubtu26cis_dconf_db_name }}'}
      loop_control:
        label: "{{ item }}"

- name: "1.7.3 | PATCH | Ensure GDM screen lock is configured"
  when:
    - ubtu26cis_rule_1_7_3
    - ubtu26cis_desktop_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.7.3
    - NIST800-53R5_NA
    - gnome
  block:
    - name: "1.7.3 | PATCH | Ensure GDM screen lock is configured | session profile"
      ansible.builtin.lineinfile:
        path: "/etc/dconf/profile/{{ ubtu26cis_dconf_db_name }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.after | default(omit) }}"
        create: true
        mode: 'u-x,go-wx'
      loop:
        - { regexp: 'user-db:user', line: 'user-db:user' }
        - { regexp: 'system-db:{{ ubtu26cis_dconf_db_name }}', line: 'system-db:{{ ubtu26cis_dconf_db_name }}', after: '^user-db.*' }
      loop_control:
        label: "{{ item }}"

    - name: "1.7.3 | PATCH | Ensure GDM screen lock is configured | make directory"
      ansible.builtin.file:
        path: "/etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d"
        owner: root
        group: root
        mode: 'u+x,go-w'
        state: directory
      notify: Update dconf

    - name: "1.7.3 | PATCH | Ensure GDM screen lock is configured | session script"
      ansible.builtin.template:
        src: etc/dconf/db/00-screensaver.j2
        dest: "/etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d/00-screensaver"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      notify: Update dconf

    - name: "1.7.3 | PATCH | Ensure GDM screen lock is configured | make lock directory"
      ansible.builtin.file:
        path: "/etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d/locks"
        owner: root
        group: root
        mode: 'u+x,go-w'
        state: directory
      notify: Update dconf

    - name: "1.7.3 | PATCH | Ensure GDM screen lock is configured | make lockfile"
      ansible.builtin.template:
        src: etc/dconf/db/00-screensaver_lock.j2
        dest: "/etc/dconf/db/{{ ubtu26cis_dconf_db_name }}.d/locks/00-screensaver"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      notify: Update dconf

