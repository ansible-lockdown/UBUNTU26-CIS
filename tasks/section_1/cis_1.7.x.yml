- name: "1.7.6 | PATCH | Ensure XDMCP is not enabled"
  when:
    - ubtu26cis_rule_1_7_6
    - ubtu26cis_desktop_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.7.6
    - NIST800-53R5_SI-4
    - gnome
    - xdcmp
  ansible.builtin.lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: '^Enable.*=.*true'
    state: absent

- name: "1.7.7 | PATCH | Ensure Xwayland is configured"
  when:
    - ubtu26cis_rule_1_7_7
    - ubtu26cis_desktop_required
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.7.7
    - NIST800-53R5_CM-7
    - gnome
  ansible.builtin.lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: '^(#)?WaylandEnable\s*='
    line: 'WaylandEnable=false'
    insertafter: '\[daemon\]'
