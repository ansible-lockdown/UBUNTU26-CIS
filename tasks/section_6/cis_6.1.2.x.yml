---

- name: "6.1.2.1 | PATCH | Ensure rsyslog is installed"
  when:
    - ubtu26cis_rule_6_1_2_1
    - "'rsyslog' not in ansible_facts['packages']"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.1.2.1
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
    - rsyslog
    - apt
  ansible.builtin.package:
    name: rsyslog
    state: present
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "6.1.2.2 | PATCH | Ensure rsyslog service is enabled and active"
  when: ubtu26cis_rule_6_1_2_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.1.2.2
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
    - rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true

- name: "6.1.2.3 | PATCH | Ensure rsyslog log file creation mode is configured"
  when: ubtu26cis_rule_6_1_2_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.1.2.3
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-6
    - NIST800-53R5_MP-2
    - rsyslog
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\$FileCreateMode|^#\$FileCreateMode'
    line: '$FileCreateMode 0640'
  notify: Restart syslog service

- name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured"
  when: ubtu26cis_rule_6_1_2_4
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - patch
    - rule_6.1.2.4
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
    - rsyslog
  vars:
    warn_control_id: '6.1.2.4'
  block:
    - name: "6.1.2.4 | AUDIT | Ensure rsyslog logging is configured | Find configuration file"
      ansible.builtin.shell: |
        set -o pipefail
        grep -r "*.emerg" /etc/* | cut -f1 -d":"
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_rsyslog_config_path.rc not in [0, 1]
      check_mode: false
      register: discovered_rsyslog_config_path

    - name: "6.1.2.4 | AUDIT | Ensure rsyslog logging is configured | Gather rsyslog current config"
      ansible.builtin.command: "cat {{ discovered_rsyslog_config_path.stdout }}"
      changed_when: false
      failed_when: discovered_rsyslog_config.rc not in [0, 1]
      check_mode: false
      register: discovered_rsyslog_config

    - name: "6.1.2.4 | AUDIT | Ensure rsyslog logging is configured | Message out config"
      when: not ubtu26cis_rsyslog_ansible_managed
      ansible.builtin.debug:
        msg:
          - "Warning!! Below is the current logging configurations for rsyslog, please review"
          - "{{ discovered_rsyslog_config.stdout_lines }}"

    - name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured | Set warning count"
      when: not ubtu26cis_rsyslog_ansible_managed
      ansible.builtin.import_tasks:
        file: warning_facts.yml

    - name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured | Automated rsyslog configuration"
      when: ubtu26cis_rsyslog_ansible_managed
      ansible.builtin.lineinfile:
        path: "{{ discovered_rsyslog_config_path.stdout }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.insertafter }}"
      with_items:
        - { regexp: '^\*.emerg', line: '*.emerg                         :omusrmsg:*', insertafter: '^# Emergencies are sent to everybody logged in' }
        - { regexp: '^auth,authpriv.\*', line: 'auth,authpriv.*                  /var/log/secure', insertafter: '^# First some standard log files.  Log by facility' }
        - { regexp: '^mail.\*|^#mail.\*', line: 'mail.*                          -/var/log/mail', insertafter: '^# First some standard log files' }
        - { regexp: '^cron.\*|^#cron.\*', line: 'cron.*                          /var/log/cron', insertafter: '^# First some standard log files' }
        - { regexp: '^mail.info|^#mail.info', line: 'mail.info                      -/var/log/mail.info', insertafter: '^# Logging for the mail system' }
        - { regexp: '^mail.warn|^#mail.warn', line: 'mail.warning                   -/var/log/mail.warn', insertafter: '^# Logging for the mail system.' }
        - { regexp: '^mail.err|^#mail.err', line: 'mail.err                        /var/log/mail.err', insertafter: '^# Logging for the mail system.' }
        - { regexp: '^\*.=warning;\*.=err|^#\*.=warning;\*.=err', line: '*.=warning;*.=err               -/var/log/warn', insertafter: '^# First some standard log files' }
        - { regexp: '^\*.crit|^#\*.crit', line: '*.crit                           /var/log/warn', insertafter: '^# First some standard log files' }
        - { regexp: '^\*.\*;mail.none;news.none|^#\*.\*;mail.none;news.none', line: '*.*;mail.none;news.none         -/var/log/messages', insertafter: '^# First some standard log files' }
        - { regexp: '^local0,local1.\*|^#local0,local1.\*', line: 'local0,local1.*                 -/var/log/localmessages', insertafter: '^# First some standard log files' }
        - { regexp: '^local2,local3.\*|^#local2,local3.\*', line: 'local2,local3.*                 -/var/log/localmessages', insertafter: '^# First some standard log files' }
        - { regexp: '^local4,local5.\*|^#local4,local5.\*', line: 'local4,local5.*                 -/var/log/localmessages', insertafter: '^# First some standard log files' }
        - { regexp: '^local6,local7.\*|^#local6,local7.\*', line: 'local6,local7.*                 -/var/log/localmessages', insertafter: '^# First some standard log files' }
      loop_control:
        label: "{{ item.line }}"
      notify: Restart syslog service

- name: "6.1.2.5 | PATCH | Ensure rsyslog is configured to send logs to a remote log host"
  when:
    - ubtu26cis_rule_6_1_2_5
    - not ubtu26cis_system_is_log_server
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - patch
    - rule_6.1.2.5
    - NIST800-53R5_AU-6
    - rsyslog
  notify: Restart syslog service
  ansible.builtin.template:
    src: etc/rsyslog.d/60-rsyslog.conf.j2
    dest: /etc/rsyslog.d/60-rsyslog.conf
    owner: root
    group: root
    mode: '0640'

- name: "6.1.2.6 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client"
  when: ubtu26cis_rule_6_1_2_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.1.2.6
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
    - NIST800-53R5_CM-6
    - rsyslog
  block:
    - name: "6.1.2.6 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client | When not a log host"
      when: not ubtu26cis_system_is_log_server
      ansible.builtin.replace:
        path: /etc/rsyslog.conf
        regexp: '({{ item }})'
        replace: '#\1'
      with_items:
        - '^(\$ModLoad|module(load="imtcp"))'
        - '^(\$(InputTCP|InputRELP|UDP)ServerRun|input(type="imtcp" port=".*"))'
      notify: Restart syslog service

    - name: "6.1.2.6 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client | When a log server"
      when: ubtu26cis_system_is_log_server
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      with_items:
        - { regexp: '^\$ModLoad|^#\$ModLoad', line: '$ModLoad imtcp' }
        - { regexp: '^\$InputTCPServerRun|^#\$InputTCPServerRun', line: '$InputTCPServerRun 514' }
      loop_control:
        label: "{{ item }}"
      notify: Restart syslog service

- name: "6.1.2.7 | PATCH | Ensure logrotate is configured"
  when:
    - ubtu26cis_rule_6_1_2_7
    - "'logrotate' in ansible_facts['packages']"
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - patch
    - logrotate
    - rule_6.1.2.7
    - NIST800-53R5_AU-8
  block:
    - name: "6.1.2.7 | AUDIT | Ensure logrotate is configured | Get logrotate settings"
      ansible.builtin.find:
        paths: /etc/logrotate.d/
      register: discovered_log_rotate_conf

    - name: "6.1.2.7 | PATCH | Ensure logrotate is configured | conf files"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*)(daily|weekly|monthly|yearly)$'
        replace: "\\1{{ ubtu26cis_logrotate }}"
      loop: "{{ discovered_log_rotate_conf.files }}"
      loop_control:
        label: "{{ item }}"

    - name: "6.1.2.7 | PATCH | Ensure logrotate is configured | logrotate.conf"
      ansible.builtin.replace:
        path: /etc/logrotate.conf
        regexp: '^(\s*)(daily|weekly|monthly|yearly)$'
        replace: "\\1{{ ubtu26cis_logrotate }}"

- name: "6.1.2.8 | PATCH | Ensure rsyslog-gnutls is installed"
  when:
    - ubtu26cis_rule_6_1_2_8
    - "'rsyslog-gnutls' not in ansible_facts['packages']"
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_6.1.2.8
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
    - rsyslog
    - apt
  ansible.builtin.package:
    name: rsyslog-gnutls
    state: present
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

- name: "6.1.2.9 | PATCH | Ensure rsyslog forwarding uses gtls"
  when:
    - ubtu26cis_rule_6_1_2_9
    - not ubtu26cis_system_is_log_server
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_6.1.2.9
    - NIST800-53R5_AU-6
    - rsyslog
  notify: Restart syslog service
  ansible.builtin.blockinfile:
    path: /etc/rsyslog.d/40-forward.conf
    create: true
    owner: root
    group: root
    mode: '0640'
    block: |
      action(type="omfwd" protocol="tcp" target="{{ ubtu26cis_remote_log_server }}" port="6514" StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name")

- name: "6.1.2.10 | PATCH | Ensure rsyslog CA certificates are configured"
  when: ubtu26cis_rule_6_1_2_10
  tags:
    - level2-server
    - level2-workstation
    - manual
    - patch
    - rule_6.1.2.10
    - NIST800-53R5_AU-6
    - rsyslog
  notify: Restart syslog service
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.d/40-forward.conf
    regexp: '^global\(DefaultNetstreamDriverCAFile'
    line: 'global(DefaultNetstreamDriverCAFile="{{ ubtu26cis_rsyslog_ca_certificate }}")'
    insertbefore: BOF
    create: true
    owner: root
    group: root
    mode: '0640'
