---

- name: "6.1.1.1.4/5/6/7 | PATCH | Create journald conf.d directory"
  when:
    - ubtu26cis_rule_6_1_1_1_4 or
      ubtu26cis_rule_6_1_1_1_5 or
      ubtu26cis_rule_6_1_1_1_6 or
      ubtu26cis_rule_6_1_1_1_7
  tags:
    - level1-server
    - level1-workstation
    - audit
    - patch
    - journald
    - rule_6.1.1.1.4
    - rule_6.1.1.1.5
    - rule_6.1.1.1.6
    - rule_6.1.1.1.7
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: 'u+x,go-w'

- name: "6.1.1.1.1 | PATCH | Ensure journald service is active"
  when: ubtu26cis_rule_6_1_1_1_1
  tags:
    - level1-server
    - level1-workstation
    - audit
    - patch
    - journald
    - rule_6.1.1.1.1
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: systemd-journald.service
    masked: false
    state: started
    enabled: true

- name: "6.1.1.1.2 | PATCH | Ensure systemd-journal-remote service is not in use"
  when:
    - not ubtu26cis_system_is_log_server
    - ubtu26cis_rule_6_1_1_1_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.1.2
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service
  loop_control:
    label: "{{ item }}"
  register: discovered_journal_remote_mask
  failed_when:
    - discovered_journal_remote_mask.failed is defined
    - discovered_journal_remote_mask.failed
    - '"Could not find the requested service" not in (discovered_journal_remote_mask.msg | default(""))'

- name: "6.1.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog"
  when: ubtu26cis_rule_6_1_1_1_3
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - journald
    - rule_6.1.1.1.3
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-4
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: ^ForwardToSyslog=
    line: ForwardToSyslog=yes
  notify: Restart journald

- name: "6.1.1.1.4 | PATCH | Ensure journald log file access is configured"
  when: ubtu26cis_rule_6_1_1_1_4
  tags:
    - level1-server
    - level1-workstation
    - audit
    - patch
    - journald
    - rule_6.1.1.1.4
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
    - NIST800-53R5_SI-5
  block:
    - name: "6.1.1.1.4 | PATCH | Ensure journald log file access is configured | Default file permissions"
      ansible.builtin.file:
        path: /usr/lib/tmpfiles.d/systemd.conf
        mode: 'g-wx,o-rwx'

    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | Check for override file"
      ansible.builtin.stat:
        path: /etc/tmpfiles.d/systemd.conf
      register: discovered_journald_tmpfile_override

    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | If override file check for journal"
      when: discovered_journald_tmpfile_override.stat.exists
      ansible.builtin.shell: |
        set -o pipefail
        grep -E 'z /var/log/journal/%m/system.journal \d*' /usr/lib/tmpfiles.d/systemd.conf
      args:
        executable: "{{ ubtu26cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_journald_fileperms_override.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_journald_fileperms_override

    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | Warning if override found"
      when:
        - discovered_journald_tmpfile_override.stat.exists
        - discovered_journald_fileperms_override.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! - tmpfiles override found /usr/lib/tmpfiles.d/systemd.conf affecting journald files please confirm matches site policy"

    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | Warning if override found"
      when:
        - discovered_journald_tmpfile_override.stat.exists
        - discovered_journald_fileperms_override.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '6.1.1.1.4'

- name: "6.1.1.1.5 | PATCH | Ensure journald log file rotation is configured"
  when: ubtu26cis_rule_6_1_1_1_5
  tags:
    - level1-server
    - level1-workstation
    - audit
    - patch
    - journald
    - rule_6.1.1.1.5
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  notify: Restart journald
  block:
    - name: "6.1.1.1.5 | PATCH | Ensure journald log file rotation is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/rotation.conf.j2
        dest: /etc/systemd/journald.conf.d/rotation.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'

    - name: "6.1.1.1.5 | PATCH | Ensure journald log file rotation is configured | comment out current entries"
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: "{{ item }}"
        replace: '#\1'
      loop:
        - '^(\s*SystemMaxUse\s*=.*)'
        - '^(\s*SystemKeepFree\s*=.*)'
        - '^(\s*RuntimeMaxUse\s*=)'
        - '^(\s*RuntimeKeepFree\s*=.*)'
        - '^(\s*MaxFileSec\s*=.*)'
      loop_control:
        label: "{{ item }}"

- name: "6.1.1.1.6 | PATCH | Ensure journald Storage is configured"
  when: ubtu26cis_rule_6_1_1_1_6
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.1.6
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
  notify: Restart journald
  block:
    - name: "6.1.1.1.6 | PATCH | Ensure journald Storage is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/storage.conf.j2
        dest: /etc/systemd/journald.conf.d/storage.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'

    - name: "6.1.1.1.6 | PATCH | Ensure journald Storage is configured | comment out current entries"
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: (?i)^(\s*storage=)
        replace: '#\1'

- name: "6.1.1.1.7 | PATCH | Ensure journald Compress is configured"
  when: ubtu26cis_rule_6_1_1_1_7
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.1.7
    - NIST800-53R5_AU-4
  notify: Restart journald
  block:
    - name: "6.1.1.1.7 | PATCH | Ensure journald Compress is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/storage.conf.j2  # Added to the same file as 6.1.1.1.6
        dest: /etc/systemd/journald.conf.d/storage.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'

    - name: "6.1.1.1.7 | PATCH | Ensure journald Compress is configured | comment out current entries"
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: (?i)^(\s*compress=)
        replace: '#\1'
