---

- name: "4.1.1 | PATCH | Ensure ufw is installed"
  when: ubtu26cis_rule_4_1_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.1
    - NIST800-53R5_SC-7
    - apt
    - ufw
  ansible.builtin.package:
    name: ufw
    state: present
    lock_timeout: "{{ ubtu26cis_apt_lock_timeout }}"

# Adding the allow OpenSSH rule while enabling ufw to allow ansible to run after enabling
- name: "4.1.2 | PATCH | Ensure ufw service is configured"
  when: ubtu26cis_rule_4_1_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.2
    - NIST800-53R5_SC-7
    - ufw
  block:
    - name: "4.1.2 | PATCH | Ensure ufw service is configured | ssh port enabled"
      community.general.ufw:
        rule: allow
        name: OpenSSH
        state: enabled
      notify: Reload ufw

    - name: "4.1.2 | PATCH | Ensure ufw service is configured | unmask service"
      ansible.builtin.systemd:
        name: ufw
        masked: false

    - name: "4.1.2 | PATCH | Ensure ufw service is configured | service"
      ansible.builtin.systemd:
        name: ufw
        enabled: true
        force: true
        state: started

- name: "4.1.3 | PATCH | Ensure ufw incoming default is configured"
  when: ubtu26cis_rule_4_1_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.3
    - NIST800-53R5_SC-7
    - ufw
  community.general.ufw:
    default: deny
    direction: incoming
  notify: Reload ufw

# Applied before 4.1.4 sets the outgoing default to deny. Without these rules a
# hardened host has no DNS, no package updates and no route to a remote log host,
# and any later task that installs a package fails. v1.0.0 has no control for
# outbound allowances - the benchmark only requires the default to be deny, which
# 4.1.4 still enforces - so this is an OPTIONAL supporting task.
- name: "OPTIONAL | PATCH | UFW allow required outbound connections"
  when:
    - ubtu26cis_rule_4_1_4
    - ubtu26cis_ufw_allow_out_ports != "all"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ufw
  community.general.ufw:
    rule: allow
    direction: out
    proto: "{{ item.proto }}"
    to_port: '{{ item.port }}'
  loop: "{{ ubtu26cis_ufw_allow_out_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  notify: Reload ufw

- name: "OPTIONAL | PATCH | UFW allow all outbound connections"
  when:
    - ubtu26cis_rule_4_1_4
    - ubtu26cis_ufw_allow_out_ports == "all"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ufw
  community.general.ufw:
    rule: allow
    direction: out
  notify: Reload ufw

- name: "4.1.4 | PATCH | Ensure ufw outgoing default is configured"
  when: ubtu26cis_rule_4_1_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.4
    - NIST800-53R5_SC-7
    - ufw
  community.general.ufw:
    default: deny
    direction: outgoing
  notify: Reload ufw

- name: "4.1.5 | PATCH | Ensure ufw routed default is configured"
  when: ubtu26cis_rule_4_1_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.5
    - NIST800-53R5_SC-7
    - ufw
  community.general.ufw:
    default: deny
    direction: routed
  notify: Reload ufw

- name: "OPTIONAL | AUDIT | Check for ufw config files"
  tags: always
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/default/ufw
    - /etc/ufw/sysctl.conf
  register: discovered_ufw_conf_files

- name: "OPTIONAL | PATCH | UFW firewall force to use /etc/sysctl.conf settings"
  when:
    - ubtu26cis_ufw_use_sysctl
    - discovered_ufw_conf_files.results[0].stat.exists | default(false)
  tags: always
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: ^IPT_SYSCTL=.*
    line: IPT_SYSCTL=/etc/sysctl.conf
    mode: 'u-x,go-wx'
  notify:
    - Reload ufw
    - Reapply sysctl settings

- name: "OPTIONAL | PATCH | Ensure ufw does not override log_martians"
  when:
    - discovered_ufw_conf_files.results[1].stat.exists | default(false)
    - item.rule
  tags: always
  ansible.builtin.replace:
    path: /etc/ufw/sysctl.conf
    regexp: '^\s*#?\s*net/ipv4/conf/{{ item.scope }}/log_martians\s*=.*$'
    replace: 'net/ipv4/conf/{{ item.scope }}/log_martians=1'
  loop:
    - {scope: 'all', rule: "{{ ubtu26cis_rule_3_3_1_16 }}"}
    - {scope: 'default', rule: "{{ ubtu26cis_rule_3_3_1_17 }}"}
  notify:
    - Reload ufw
    - Reapply sysctl settings
