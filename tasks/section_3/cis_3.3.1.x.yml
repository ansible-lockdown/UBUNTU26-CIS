---

- name: "3.3.1.1 | PATCH | Ensure net.ipv4.ip_forward is configured"
  when:
    - ubtu26cis_rule_3_3_1_1
    - not ubtu26cis_is_router
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_3.3.1.1
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - ip_forwarding
    - sysctl
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '0'
    sysctl_set: true
    sysctl_file: "{{ ubtu26cis_sysctl_network_conf }}"
    state: present
    reload: true
    ignoreerrors: true
  notify: Flush ipv4 route table

