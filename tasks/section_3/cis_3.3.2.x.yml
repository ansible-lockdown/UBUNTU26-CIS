---

- name: "3.3.2.1 | PATCH | Ensure net.ipv6.conf.all.forwarding is configured"
  when:
    - ubtu26cis_rule_3_3_2_1
    - ubtu26cis_ipv6_required
    - not ubtu26cis_is_router
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_3.3.2.1
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - ipv6
    - ip_forwarding
    - sysctl
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '0'
    sysctl_set: true
    sysctl_file: "{{ ubtu26cis_sysctl_network_conf }}"
    state: present
    reload: true
    ignoreerrors: true
  notify: Flush ipv6 route table

