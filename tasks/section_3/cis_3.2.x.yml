- name: "3.2.7 | AUDIT | Ensure unneeded network protocol kernel modules are not available"
  when: ubtu26cis_rule_3_2_7
  tags:
    - level1-server
    - level1-workstation
    - audit
    - rule_3.2.7
    - unneeded_network_protocols
  block:
    - name: "3.2.7 | AUDIT | Ensure unneeded network protocol kernel modules are not available | Discover loaded net modules"
      ansible.builtin.shell: >-
        lsmod | awk '{print $1}' | grep -Ff <(find /lib/modules/"$(uname -r)"/kernel/net
        -type f -name '*.ko*' -printf '%f\n' 2>/dev/null | sed -E 's/\.ko(\.[xg]z|\.zst)?$//' | sort -u) || true
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_net_modules_loaded

    - name: "3.2.7 | AUDIT | Ensure unneeded network protocol kernel modules are not available | Output Warning"
      when: discovered_net_modules_loaded.stdout | length > 0
      ansible.builtin.debug:
        msg: |
          "Warning!! Discovered loaded network protocol kernel modules that need review. This is a manual task
          {{ discovered_net_modules_loaded.stdout_lines }}"

    - name: "3.2.7 | AUDIT | Ensure unneeded network protocol kernel modules are not available | Capture Warning"
      when: discovered_net_modules_loaded.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '3.2.7'
