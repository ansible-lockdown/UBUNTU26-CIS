---

- name: "3.2.1 | PATCH | Ensure atm kernel module is not available"
  when: ubtu26cis_rule_3_2_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_3.2.1
    - NIST800-53R5_CM-7
    - NIST800-53R5_SI-4
    - atm
  block:
    - name: "3.2.1 | PATCH | Ensure atm kernel module is not available | modprobe"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/atm.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: true
        mode: 'u-x,go-wx'
      loop:
        - { regexp: "^(#)?install atm(\\s|$)", line: "install atm /bin/true" }
        - { regexp: "^(#)?blacklist atm(\\s|$)", line: "blacklist atm" }

    - name: "3.2.1 | PATCH | Ensure atm kernel module is not available | blacklist"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist.conf
        regexp: "^(#)?blacklist atm(\\s|$)"
        line: "blacklist atm"
        create: true
        mode: 'go-rwx'

    - name: "3.2.1 | PATCH | Ensure atm kernel module is not available | unload"
      community.general.modprobe:
        name: atm
        state: absent
      failed_when: false

