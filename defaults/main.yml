## Controls 3.3.x - Configure Network Kernel Parameters

# This variable contains the path to the file in which, sysctl saves its configurations.
# Its default value is `/etc/sysctl.conf`.
# Ubuntu 26.04 no longer ships the /etc/sysctl.d/99-sysctl.conf -> /etc/sysctl.conf
# symlink, so systemd-sysctl does NOT apply /etc/sysctl.conf at boot and any
# network parameters written there are lost on reboot. Keep this under
# /etc/sysctl.d/ so the settings persist, as the kernel parameters already do.
ubtu26cis_sysctl_network_conf: /etc/sysctl.d/97_cis_network.conf
